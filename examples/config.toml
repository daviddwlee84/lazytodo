# Copy/edit only the sources you intend to query. Native gh/glab own credentials.
refresh_interval = "5m"
color = "auto"
mouse = true # TUI click/wheel/drag-to-copy; false keeps native terminal selection (M toggles at runtime).

[[sources]]
id = "github-work"
kind = "github"
host = "github.com"
scope = "owner/repository"
disabled = true # Enable after setting the correct scope.
# priority_labels = ["P0", "P1", "priority::high", "urgent"] # Exact names; omit for auto hints.
# priority_labels = [] # Disable priority hints for this source.

[[sources]]
id = "gitlab-work"
kind = "gitlab"
host = "gitlab.example.com"
scope = "group/project"
disabled = true

[[views]]
name = "Open"
query = "state:open"

[[views]]
name = "Review"
query = 'label:"needs review"'
