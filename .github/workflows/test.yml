name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/lazytodo ./cmd/lazytodo
      - run: python3 scripts/pty_smoke.py bin/lazytodo
      - run: python3 scripts/config_edit_smoke.py bin/lazytodo
      - run: python3 scripts/setup_smoke.py bin/lazytodo
      - run: python3 scripts/repo_context_smoke.py bin/lazytodo
      - run: python3 scripts/check_todo.py
